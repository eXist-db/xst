name: Test

# push only on main, branches with a pull request are tested by the
# pull_request event, merged into main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests cannot run on windows due to issues with the windows server 2019 images
# the github action runners are using not being able to run linux docker images
# https://github.com/actions/virtual-environments/issues/1143

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Exist latest and release are in development (eXist 7), so failures are
    # allowed, but valuable to log
    continue-on-error: ${{ matrix.exist-version == 'latest' || matrix.exist-version == 'release' }}
    env:
      # `xst package install github-release` authenticates with it: unauthenticated
      # GitHub API requests share 60 per hour per runner IP and fail the suite
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        exist-version: [latest, release, 6.4.1, 5.4.1, 4.10.0]
    services:
      exist:
        image: existdb/existdb:${{ matrix.exist-version }}
        ports:
          - 8080:8080
          - 8443:8443
    steps:
      - uses: actions/checkout@v7
      - name: Set up NodeJS v${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --omit=optional
      - run: npm link
      - name: Install public-repo locally
        # The registry tests (spec/tests/package/install/registry.js) skip
        # themselves where public-repo is not installed.
        # - 4.10.0 and 5.4.1: public-repo does not install there
        # - release (7.0.0-beta5): publishing to public-repo fails because of
        #   https://github.com/eXist-db/exist/issues/6725, fixed on latest
        # - latest needs public-repo >= 4.3.1 (response:stream-binary#2 is gone)
        if: matrix.exist-version == '6.4.1' || matrix.exist-version == 'latest'
        run: |
          xst package install github-release templating v1.2.1 --config spec/fixtures/.env --verbose
          xst package install github-release public-repo ${{ matrix.exist-version == 'latest' && 'v4.3.2' || 'v4.0.0' }} --config spec/fixtures/.env --verbose
      - run: npm test
